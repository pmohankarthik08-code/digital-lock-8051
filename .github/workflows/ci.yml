name: Digital Lock Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile tests
        run: gcc -std=c11 -Wall -Wextra -o test_lock_logic test_lock_logic.c

      - name: Run tests
        run: ./test_lock_logic

      - name: Install SDCC
        run: |
          sudo apt-get update
          sudo apt-get install -y sdcc

      - name: Compile 8051 firmware
        run: |
          sdcc --version
          sdcc -mmcs51 --model-small -o digital_lock_8051.ihx firmware/digital_lock_8051.c
          packihx digital_lock_8051.ihx > digital_lock_8051.hex

      - name: Upload 8051 firmware HEX
        uses: actions/upload-artifact@v4
        with:
          name: digital-lock-8051-firmware
          path: digital_lock_8051.hex
