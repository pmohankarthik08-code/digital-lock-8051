name: Digital Lock Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile tests
        run: gcc -std=c11 -Wall -Wextra -o test_lock_logic test_lock_logic.c

      - name: Run tests
        run: ./test_lock_logic
